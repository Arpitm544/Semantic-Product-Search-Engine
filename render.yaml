services:
  - type: web
    name: semantic-product-search-api
    runtime: python
    rootDir: backend
    buildCommand: bash scripts/render_build.sh
    startCommand: python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: semantic_product_search
      - key: MONGO_COLLECTION
        value: amazon_products
      - key: ATLAS_VECTOR_INDEX
        value: product_vectors
      - key: SEMANTIC_MODEL_PATH
        value: models/colab-export/esci-minilm-20k
      - key: RERANKER_MODEL_PATH
        value: models/ms-marco-MiniLM-L6-v2
      - key: MODEL_ARTIFACT_URL
        sync: false
      - key: MODEL_ARTIFACT_SHA256
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: CLERK_ISSUER_URL
        sync: false
      - key: TOKENIZERS_PARALLELISM
        value: "false"
