name: Pull Request Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write # Allows creation of missing repository labels.

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      # Read configuration from the base repository through the API.
      # Do not check out or execute code from the pull request.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
